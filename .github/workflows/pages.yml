# Publishes the app on GitHub Pages at https://jvtomax99.github.io/Curly-girl-Sanctuary-/
# every time main changes. It tests and builds first; if anything fails, nothing is published.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Pinned: Playwright can't install its browser on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Nothing is published if any screen has a script error or a missing file.
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Site check
        run: node .github/site-check.cjs index.html "index.html#/quiz/0" "index.html#/card"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
